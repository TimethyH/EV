name: Windows build

on:
  push:
    branches: [ imgui-editor, main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025-vs2026
    defaults:
      run:
        shell: pwsh
    env:
      ASSIMP_SRC: EV-Engine/EV-Engine/thirdparty/assimp
      LIB_DIR: EV-Engine/EV-Engine/lib
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2
        with:
          vs-prerelease: true

      - name: Show toolchain
        run: msbuild -version

      # assimp-vc145-mtd.lib and the generated assimp config headers are not committed
      # (they are produced locally by CMake), so build them here and cache the result.
      - name: Cache assimp
        id: cache-assimp
        uses: actions/cache@v4
        with:
          path: assimp-out
          key: assimp-${{ runner.os }}-v6.0.2-debug-v1

      # The vendored assimp tree is incomplete (parts are gitignored), so build the matching upstream release.
      - name: Build assimp
        if: steps.cache-assimp.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 -b v6.0.2 https://github.com/assimp/assimp.git assimp-src
          cmake -S assimp-src -B assimp-build -A x64 `
            -DBUILD_SHARED_LIBS=OFF -DASSIMP_BUILD_TESTS=OFF -DASSIMP_BUILD_ASSIMP_TOOLS=OFF `
            -DASSIMP_BUILD_SAMPLES=OFF -DASSIMP_INSTALL=OFF -DASSIMP_BUILD_ZLIB=ON -DASSIMP_WARNINGS_AS_ERRORS=OFF
          cmake --build assimp-build --config Debug --parallel
          New-Item -ItemType Directory -Force assimp-out/include/assimp | Out-Null
          Copy-Item assimp-build/include/assimp/*.h assimp-out/include/assimp/
          Get-ChildItem assimp-build -Recurse -Filter "assimp-*.lib" | ForEach-Object { Copy-Item $_.FullName assimp-out/assimp.lib }

      - name: Stage assimp
        run: |
          Copy-Item assimp-out/include/assimp/*.h "$env:ASSIMP_SRC/include/assimp/"
          Copy-Item assimp-out/assimp.lib "$env:LIB_DIR/assimp-vc145-mtd.lib"

      - name: Build EV-Engine (Debug x64)
        run: msbuild EV-Engine/EV-Engine/EV-Engine.vcxproj /m /p:Configuration=Debug /p:Platform=x64 /p:SolutionDir="$PWD\EV-Engine\\" /nologo /v:minimal

      - name: Build OceanRenderer (Debug x64)
        run: msbuild EV-Engine/OceanRenderer/OceanRenderer.vcxproj /m /p:Configuration=Debug /p:Platform=x64 /p:SolutionDir="$PWD\EV-Engine\\" /nologo /v:minimal

      - name: Build ShaderArt (Debug x64)
        run: msbuild EV-Engine/ShaderArt/ShaderArt.vcxproj /m /p:Configuration=Debug /p:Platform=x64 /p:SolutionDir="$PWD\EV-Engine\\" /nologo /v:minimal

      # Run the editor on the WARP software rasterizer and take screenshots, so UI changes can be checked without a GPU.
      - name: Smoke test (WARP)
        timeout-minutes: 20
        working-directory: EV-Engine
        env:
          GH_TOKEN: ${{ github.token }}
          EV_USE_WARP: "1"
          EV_EDITOR_TEXTURE: "Depth Render Target"
        run: |
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting" /v DontShowUI /t REG_DWORD /d 1 /f | Out-Null
          New-Item -ItemType Directory -Force assets/damaged_helmet, ../screenshots | Out-Null
          gh release download Assets -p sky4k.hdr -D assets -R ${{ github.repository }} --clobber
          $base = "https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/DamagedHelmet/glTF"
          foreach ($f in "DamagedHelmet.gltf","DamagedHelmet.bin","Default_albedo.jpg","Default_AO.jpg","Default_emissive.jpg","Default_metalRoughness.jpg","Default_normal.jpg") {
            curl.exe -sSL -o "assets/damaged_helmet/$f" "$base/$f"
          }

          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Save-Screenshot($path) {
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $bitmap.Save($path, [System.Drawing.Imaging.ImageFormat]::Png)
            $graphics.Dispose(); $bitmap.Dispose()
            Write-Host "Saved $path ($($bounds.Width)x$($bounds.Height))"
          }

          $exe = Get-ChildItem -Recurse -Filter OceanRenderer.exe | Select-Object -First 1
          Write-Host "Running $($exe.FullName)"
          $process = Start-Process -FilePath $exe.FullName -WorkingDirectory (Get-Location) -PassThru
          $start = Get-Date
          $windowTime = $null
          while (((Get-Date) - $start).TotalSeconds -lt 900) {
            Start-Sleep -Seconds 5
            $process.Refresh()
            if ($process.HasExited) { Write-Host "Process exited with code $($process.ExitCode)"; break }
            if (-not $windowTime -and $process.MainWindowHandle -ne 0) { $windowTime = Get-Date; Write-Host "Window shown after $([int]((Get-Date) - $start).TotalSeconds)s" }
            if ($windowTime -and ((Get-Date) - $windowTime).TotalSeconds -ge 60) { break }
          }
          Save-Screenshot "../screenshots/editor.png"
          if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          if (-not $windowTime) { Write-Host "::warning::The editor window never appeared" }
          if (Test-Path ev_crash.log) { Write-Host "::error::$(Get-Content ev_crash.log -Raw)" }

          # Also print a small JPEG of the screenshot as base64, for reading it without downloading artifacts.
          $image = [System.Drawing.Image]::FromFile((Resolve-Path "../screenshots/editor.png"))
          $codec = [System.Drawing.Imaging.ImageCodecInfo]::GetImageEncoders() | Where-Object { $_.MimeType -eq "image/jpeg" }
          $parameters = New-Object System.Drawing.Imaging.EncoderParameters 1
          $parameters.Param[0] = New-Object System.Drawing.Imaging.EncoderParameter ([System.Drawing.Imaging.Encoder]::Quality, [long]70)
          $stream = New-Object System.IO.MemoryStream
          $image.Save($stream, $codec, $parameters)
          $image.Dispose()
          $base64 = [Convert]::ToBase64String($stream.ToArray())
          Write-Host "SCREENSHOT-BEGIN"
          for ($i = 0; $i -lt $base64.Length; $i += 4000) { Write-Host $base64.Substring($i, [Math]::Min(4000, $base64.Length - $i)) }
          Write-Host "SCREENSHOT-END"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore
