name: Birthday assets

# Downloads the CC0 assets of the DadsBirthday game (Poly Haven, Kenney, Khronos) and uploads them as
# birthday-assets.zip to the "birthday-assets" release. Unzipped in EV-Engine/ it creates assets/birthday.
# download-birthday-assets.bat, the CI smoke test and the game package all use that release.
on:
  push:
    branches: [ Dads-Birthday ]
    paths: [ .github/workflows/birthday-assets.yml ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download
        run: |
          set -euo pipefail
          A=pack/assets/birthday
          mkdir -p $A/sky $A/sand $A/bricks $A/boardwalk $A/rifle/Textures $A/cake/Textures $A/palms/Textures $A/duck
          mkdir -p $A/pirate/Textures $A/survival/Textures $A/holiday/Textures $A/food/Textures

          # Poly Haven: sky and the two floor materials (2k color, DirectX normal map, AO/roughness/metal).
          polyhaven() { curl -sfL "https://api.polyhaven.com/files/$1" | jq -r "$2"; }
          curl -sfL -o $A/sky/kloofendal_48d_partly_cloudy_puresky.hdr \
            "$(polyhaven kloofendal_48d_partly_cloudy_puresky '.hdri["4k"].hdr.url')"
          for map in Diffuse nor_dx arm; do
            url=$(polyhaven sand_01 ".${map}[\"2k\"].jpg.url"); curl -sfL -o "$A/sand/$(basename "$url")" "$url"
            url=$(polyhaven brick_floor_003 ".${map}[\"2k\"].jpg.url"); curl -sfL -o "$A/bricks/$(basename "$url")" "$url"
            url=$(polyhaven wood_planks ".${map}[\"2k\"].jpg.url"); curl -sfL -o "$A/boardwalk/$(basename "$url")" "$url"
          done

          # Kenney kits: rifle, birthday cake, palm trees.
          kenney() {
            zip=$(curl -sfL "https://kenney.nl/assets/$1" | grep -oE "https://kenney.nl/media/pages/assets/$1/[^\"']+\.zip" | head -1)
            curl -sfL -o "$1.zip" "$zip"
            mkdir -p "kenney/$1" && unzip -q -o "$1.zip" -d "kenney/$1"
          }
          kenney blaster-kit
          kenney food-kit
          kenney pirate-kit
          kenney survival-kit
          kenney holiday-kit
          cp "kenney/blaster-kit/Models/GLB format/blaster-e.glb" $A/rifle/
          cp "kenney/blaster-kit/Models/GLB format/Textures/colormap.png" $A/rifle/Textures/
          cp kenney/blaster-kit/License.txt $A/rifle/
          cp "kenney/food-kit/Models/GLB format/cake-birthday.glb" $A/cake/
          cp "kenney/food-kit/Models/GLB format/Textures/colormap.png" $A/cake/Textures/
          cp kenney/food-kit/License.txt $A/cake/
          for p in palm-detailed-straight palm-detailed-bend; do cp "kenney/pirate-kit/Models/GLB format/$p.glb" $A/palms/; done
          cp "kenney/pirate-kit/Models/GLB format/Textures/colormap.png" $A/palms/Textures/
          cp kenney/pirate-kit/License.txt $A/palms/

          # Props that make the beach lively.
          props() { # kit folder models...
            kit=$1; folder=$2; shift 2
            for m in "$@"; do cp "kenney/$kit/Models/GLB format/$m.glb" "$A/$folder/"; done
            cp "kenney/$kit/Models/GLB format/Textures/colormap.png" "$A/$folder/Textures/"
            cp "kenney/$kit/License.txt" "$A/$folder/"
          }
          props pirate-kit pirate boat-row-large tool-paddle barrel chest crate crate-bottles rocks-sand-a rocks-sand-b rocks-sand-c \
            grass-plant flag-pennant ship-medium structure-platform-dock
          props survival-kit survival tent-canvas campfire-pit bedroll signpost
          props holiday-kit holiday bench lantern lights-colored present-a-cube present-b-round present-a-rectangle
          props food-kit food cocktail coconut pineapple watermelon

          # Khronos glTF sample: the duck (stands in for the birds).
          for f in Duck.gltf Duck0.bin DuckCM.png; do
            curl -sfL -o $A/duck/$f "https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/Duck/glTF/$f"
          done
          curl -sfL -o $A/duck/LICENSE.md https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/Duck/LICENSE.md

          cat > $A/CREDITS.txt <<'EOF'
          Assets used by the DadsBirthday game.

          sky/kloofendal_48d_partly_cloudy_puresky.hdr  Poly Haven (Greg Zaal, Jarod Guest), CC0  https://polyhaven.com/a/kloofendal_48d_partly_cloudy_puresky
          sand/sand_01_*                                Poly Haven, CC0  https://polyhaven.com/a/sand_01
          bricks/brick_floor_003_*                      Poly Haven, CC0  https://polyhaven.com/a/brick_floor_003
          boardwalk/wood_planks_*                       Poly Haven, CC0  https://polyhaven.com/a/wood_planks
          pirate/, survival/, holiday/, food/           Kenney Pirate, Survival, Holiday and Food Kits, CC0  https://kenney.nl
          rifle/blaster-e.glb                           Kenney Blaster Kit, CC0  https://kenney.nl/assets/blaster-kit
          cake/cake-birthday.glb                        Kenney Food Kit, CC0  https://kenney.nl/assets/food-kit
          palms/palm-detailed-*.glb                     Kenney Pirate Kit, CC0  https://kenney.nl/assets/pirate-kit
          duck/Duck.gltf                                Khronos glTF Sample Assets, see duck/LICENSE.md
          EOF
          sed -i 's/^          //' $A/CREDITS.txt

          (cd pack && zip -qr ../birthday-assets.zip assets)
          unzip -l birthday-assets.zip

      - name: Upload to the birthday-assets release
        run: |
          gh release view birthday-assets -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create birthday-assets -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Birthday game assets" \
              --notes "Assets of the DadsBirthday game (CC0, see assets/birthday/CREDITS.txt). Unzip in EV-Engine/; download-birthday-assets.bat does this."
          gh release upload birthday-assets -R "$GITHUB_REPOSITORY" --clobber birthday-assets.zip
